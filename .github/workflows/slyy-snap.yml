name: Slyy Snap release

# Builds snap/ on macOS and publishes release slyy-snap-v<version> with
# SlyySnap-<version>.dmg + .zip + SHA256SUMS. Never takes the "Latest" badge
# (that stays with Slyy Desktop).
#
# Release: bump snap/CHANGELOG.md, then either push a tag
#   git tag slyy-snap-v1.0.1 && git push origin slyy-snap-v1.0.1
# or run this workflow by hand with the version.
#
# Signing + notarization (repository secrets; without them: ad-hoc signed):
#   SNAP_SIGN_P12           base64 of a .p12 with a code signing certificate +
#                           private key: the self-signed "Slyy Snap Code Signing"
#                           (stable signature, no notarization) or a Developer ID
#                           Application certificate (also notarizable)
#   SNAP_SIGN_P12_PASSWORD  its export password
#   SNAP_SIGN_IDENTITY      certificate name, e.g. "Slyy Snap Code Signing" or
#                           "Developer ID Application: <Name> (<TEAMID>)"
# Switching certificates: set allowedDeveloperTeam in Updater.swift and release
# that with the old certificate first, or installed copies refuse the update.
#   NOTARY_KEY_P8           App Store Connect API key (.p8 file content, plain
#                           or base64)
#   NOTARY_KEY_ID           its Key ID
#   NOTARY_ISSUER_ID        its Issuer ID
# Signed + notarized builds open without Gatekeeper warnings, keep the Screen
# Recording permission across updates, and the app then only accepts updates
# signed by the same team.

on:
  push:
    tags: ['slyy-snap-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.1'
        required: true
      dry_run:
        description: 'Build only, do not publish (artifacts kept on the run)'
        type: boolean
        default: false
      test_signing:
        description: 'Dry runs only: sign with a throwaway self-signed certificate'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: slyy-snap-release

jobs:
  release:
    runs-on: macos-15
    env:
      INPUT_VERSION: ${{ inputs.version }}
      SNAP_SIGN_P12: ${{ secrets.SNAP_SIGN_P12 }}
      SNAP_SIGN_P12_PASSWORD: ${{ secrets.SNAP_SIGN_P12_PASSWORD }}
      SNAP_SIGN_IDENTITY: ${{ secrets.SNAP_SIGN_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#slyy-snap-v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid version '$v'"; exit 1; }
          echo "VERSION=$v" >>"$GITHUB_ENV"

      - name: Throwaway signing certificate (test)
        if: inputs.dry_run && inputs.test_signing
        run: |
          cd "$RUNNER_TEMP"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=Slyy Snap Test Signing\n[ext]\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' >t.cnf
          openssl req -x509 -newkey rsa:2048 -nodes -keyout t.key -out t.pem -days 2 -config t.cnf
          openssl pkcs12 -export -legacy -inkey t.key -in t.pem -name "Slyy Snap Test Signing" -passout pass:test -out t.p12 ||
            openssl pkcs12 -export -inkey t.key -in t.pem -name "Slyy Snap Test Signing" -passout pass:test -out t.p12
          {
            echo "TEST_SIGN_P12=$(base64 -i t.p12 | tr -d '\n')"
            echo "TEST_SIGN_P12_PASSWORD=test"
            echo "TEST_SIGN_IDENTITY=Slyy Snap Test Signing"
          } >>"$GITHUB_ENV"

      - name: Signing certificate (optional)
        if: env.SNAP_SIGN_P12 != '' || env.TEST_SIGN_P12 != ''
        run: |
          if [ -z "$SNAP_SIGN_P12" ]; then
            SNAP_SIGN_P12="$TEST_SIGN_P12"; SNAP_SIGN_P12_PASSWORD="$TEST_SIGN_P12_PASSWORD"; SNAP_SIGN_IDENTITY="$TEST_SIGN_IDENTITY"
          fi
          [ -n "$SNAP_SIGN_IDENTITY" ] || { echo "SNAP_SIGN_IDENTITY secret missing"; exit 1; }
          kc="$RUNNER_TEMP/snap.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$SNAP_SIGN_P12" | base64 --decode >"$RUNNER_TEMP/snap.p12"
          security import "$RUNNER_TEMP/snap.p12" -k "$kc" -P "$SNAP_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/snap.p12"
          # Developer ID intermediate CAs (in case the .p12 holds only the leaf)
          for ca in DeveloperIDG2CA.cer DeveloperIDCA.cer; do
            curl -fsSL -o "$RUNNER_TEMP/$ca" "https://www.apple.com/certificateauthority/$ca" &&
              security import "$RUNNER_TEMP/$ca" -k "$kc" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc"
          echo "SIGN_IDENTITY=$SNAP_SIGN_IDENTITY" >>"$GITHUB_ENV"

      - name: Notary key (optional)
        if: env.NOTARY_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/notary.p8"
          case "$NOTARY_KEY_P8" in
          *"BEGIN PRIVATE KEY"*) printf '%s\n' "$NOTARY_KEY_P8" >"$key" ;;
          *) echo "$NOTARY_KEY_P8" | base64 --decode >"$key" ;;
          esac
          echo "NOTARY_KEY=$key" >>"$GITHUB_ENV"

      - name: Build
        run: snap/scripts/build.sh "$VERSION"

      - name: Build artifacts (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: slyy-snap-${{ env.VERSION }}
          path: snap/dist/

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="slyy-snap-v$VERSION"
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' snap/CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          {
            echo
            echo "Install (macOS 13+): download **SlyySnap-$VERSION.dmg**, open it, drag Slyy Snap to Applications."
            [ -n "$NOTARY_KEY_P8" ] || echo 'First launch: System Settings > Privacy & Security > "Open Anyway" (not notarized).'
            echo
            echo 'Or from Terminal (no Gatekeeper prompt):'
            echo
            echo '    curl -fsSL https://raw.githubusercontent.com/simplify-erp/slyy-releases/main/snap-install.sh | sh'
          } >>"$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            "snap/dist/SlyySnap-$VERSION.dmg" "snap/dist/SlyySnap-$VERSION.zip" snap/dist/SHA256SUMS \
            --title "Slyy Snap $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false
